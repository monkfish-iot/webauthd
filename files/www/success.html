<script type="text/javascript" src="js/avalon.min.js"></script>
<script type="text/javascript">

function GetRequest() {
    var url = location.search; //获取url中"?"符后的字串
    var theRequest = new Object();
    if (url.indexOf("?") != -1) {
        var str = url.substr(1);
        strs = str.split("&");
        for(var i = 0; i < strs.length; i ++) {
            theRequest[strs[i].split("=")[0]]=decodeURI(strs[i].split("=")[1]);
        }
    }
    return theRequest;
} 

//调用
var Request = new Object();
Request = GetRequest();
var name,age;
Quota_Data = bytesToSize(Request['Quota-Data']);
In_Rate = bitsToSize(Request['In-Rate']) ;
Out_Rate = bitsToSize(Request['Out-Rate']) ;
Session_Timeout = formatTime(Request['Session-Timeout']);
User_IP=Request['User-IP'];




function formatTime(session_time){
   	
    sec=parseInt(session_time);
    if(isNaN(sec)){
    	return ""
    }
    if(session_time == "0"){
        return "不限时";
    }
    run_days=sec / 86400;
    run_hour=(sec % 86400)/3600;
    run_minute=(sec % 3600)/60;
    run_second=sec % 60;
    return parseInt(run_days)+"天"+parseInt(run_hour)+"小时"+parseInt(run_minute)+"分"+parseInt(run_second)+"秒"
};


Number.prototype.formatTime=function(){
   	
    sec=parseInt(this);
    if(isNaN(sec)){
    	return ""
    }
    run_days=sec / 86400;
    run_hour=(sec % 86400)/3600;
    run_minute=(sec % 3600)/60;
    run_second=sec % 60;
    return parseInt(run_days)+"天"+parseInt(run_hour)+"小时"+parseInt(run_minute)+"分"+parseInt(run_second)+"秒"
};

function bytesToSize(bytes) {
	if(typeof(bytes) == "undefined"){
		return "";
	}
	if (bytes == "0") 
		return '不限流量';
	var k = 1024;
	sizes = ['B','KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
	i = Math.floor(Math.log(bytes) / Math.log(k));
	return (bytes / Math.pow(k, i)).toFixed(3) + ' ' + sizes[i]; 
}


function bitsToSize(bits) {
	if(typeof(bits) == "undefined"){
		return "";
	}
	if (bits === 0) 
		return '0 b';
	var k = 1024;
	sizes = ['b','Kb', 'Mb', 'Gb', 'Tb', 'Pb', 'Eb', 'Zb', 'Yb'];
	i = Math.floor(Math.log(bits) / Math.log(k));
	return (bits / Math.pow(k, i)).toFixed(3) + ' ' + sizes[i]; 
}


var vm_contents,vm_body;
document.title="登录成功";
