# WrtHub Pro webauthd 框架（Portal 开启 · 三层）：专属命名空间
# 只 destroy 自己的 ip webauthd_filter / ip webauthd_nat 两张表（destroy 对不存在的表为空操作），
# 绝不 flush ruleset —— inet mwan3（多WAN）、ip wrthub（防火墙）、ip wrthub_qos（QoS）不受影响。
destroy table ip webauthd_filter
destroy table ip webauthd_nat

table ip webauthd_filter {
	#chain dnsmasq {
	#	ip saddr 192.168.11.108 udp dport 67 drop
	#}

	set white_list {
		type ipv4_addr
		#elements = {192.168.11.1, 192.168.11.238}
	}

	chain input {
		type filter hook input priority filter; policy accept;
		#jump dnsmasq
		#udp dport 67 drop
		iifname "wan" udp dport 67 drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		#meta mark 0x00002771 accept
		#udp dport 67 accept
		ip daddr @white_list accept
		ip saddr @white_list accept
	}

}

table ip webauthd_nat {
	set white_list {
		type ipv4_addr
		#elements = {192.168.11.1, 192.168.11.238}
	}

	set authed {
		type ipv4_addr
	}

	chain prerouting {
		type nat hook prerouting priority -100; policy accept;
		ip saddr @authed return
		ip daddr @white_list return
		tcp dport 80 redirect to :20080
		#capture_dns
		#udp dport 53 redirect to :20053
		tcp dport 443 redirect to :20443
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "wan" masquerade
		#ip saddr 192.168.11.0/24 masquerade
		ip daddr @authed counter
	}
}
