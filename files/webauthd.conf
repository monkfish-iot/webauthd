config  base 'generic'
	option enabled '1'
	option layer '2'
	option portal_interface 'br-lan'
	option portal_ip ''
	option capture_dns '1'
	option layer2_ifname 'eth0.1'
	option idle_timeout '120'
	option mac_auth '1'
	option mac_auth_format '1'
	option cloud_config '0'
	option auth_source 'radius'

config portal 'portal'
	option portal_type '3'
	option http_portal_auth '1'
	option hw_portal_auth '0'
	option login_title 'Welcome to Portal'
	option login_topic 'Welcome'
	option login_footer 'WebAuth'
	option success_title 'Welcome to use Portal System'
	option success_topic 'Login Success'
	option success_footer 'Copyright'
	option failed_title 'Failed title'
	option failed_topic 'Failed topic'
	option portal_port '9091'
	option portal_server '127.0.0.1'
	option proxy_pass 'http://127.0.0.1:9091'
	option portal_url 'http://127.0.0.1:9091'
	option cache_enable '1'
	option cache_valid_time '60m'
	option cache_max_size '100m'
	option cache_inactive_time '60m'

config radius 'radius'
	option local_radius_client  '0'
	option primary_auth_port '1812'
	option primary_acct_port '1813'
	option primary_auth_secret 'testing123'
	option primary_acct_secret 'testing123'
	option primary_auth_server '127.0.0.1'
	option primary_acct_server '127.0.0.1'
	option acct_interval '60'
	option every_hour_acct '0'
	option nas_if 'br-lan'
	option tenant_org_id ''

# HTTP(S) 认证源: auth_source='http' 时生效
config http_auth 'http_auth'
	option auth_url ''
	option acct_url ''
	option shared_secret ''
	option password_type 'plain'
	option timeout '5'
	option tls_verify '1'

config white_list 'white_list'
