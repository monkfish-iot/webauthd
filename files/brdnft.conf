# WrtHub Pro webauthd 框架（Portal 开启 · 二层桥接）：专属命名空间
# 桥模式下客户端经 br-lan 出去需要源 NAT（masquerade oifname br-lan），
# prerouting 做 portal 引导；已认证客户端的 filter accept 规则由 webauthd
# 动态注入 forward 链（带 counter 用于计费），authed set 控制 portal 绕过。
# 只 destroy 自己的 ip webauthd_filter / ip webauthd_nat 两张表，绝不 flush ruleset。
destroy table ip webauthd_filter
destroy table ip webauthd_nat

table ip webauthd_filter {
	set white_list {
		type ipv4_addr
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ip daddr @white_list accept
		ip saddr @white_list accept
		udp dport { 67, 68 } accept
		udp sport { 67, 68 } accept
	}
}

table ip webauthd_nat {
	set white_list {
		type ipv4_addr
	}

	set authed {
		type ipv4_addr
	}

	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		ip saddr @authed return
		ip daddr @white_list return
		tcp dport 80 redirect to :20080
		tcp dport 443 redirect to :20443
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "br-lan" masquerade
		ip daddr @authed counter
	}
}
