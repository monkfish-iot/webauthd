user nobody nogroup;
worker_processes  2;

#error_log  logs/nac_https_error.log;
pid        /tmp/nac_https_nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    sendfile        on;
    keepalive_timeout  65;
    # HTTPS server
    server {
        listen       9999 ssl;
        ssl                  on;
        ssl_certificate       /usr/local/natshell/nac/https/server.crt;
        ssl_certificate_key   /usr/local/natshell/nac/https/server_nopwd.key;

        location / {
                root   /usr/local/natshell/nac/https;
                index  index.html;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_redirect off;
                add_header Cache-Control no-store;
        }
    }
	error_page  404              /index.html;

    # HTTP server
    default_type  application/octet-stream;
    lua_package_path "/usr/local/natshell/nac/upload_portal/cgi-bin/?.lua;;";
    server {
        listen       10010;
        server_name  _;
        location / {
            root /usr/local/natshell/nac/upload_portal/html;
            index login.html index.html msg.html;
        }
        location /getinfo {
            charset utf-8;
            default_type text/html;
            keepalive_timeout 0;
            lua_code_cache on;
            content_by_lua_file /usr/local/natshell/nac/upload_portal/cgi-bin/getinfo.lua;
        }
        location /auth {
proxy_pass http://127.0.0.1:14150/auth;                                        
        }                                                                                
    }                                                                                    
}                 
