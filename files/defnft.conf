# WrtHub Pro webauthd 框架（Portal 关闭）：专属命名空间
# 只 destroy 自己的表（destroy 对不存在的表为空操作），绝不 flush ruleset。
destroy table ip webauthd_filter
destroy table ip webauthd_nat

table ip webauthd_nat {
	chain input {
		type filter hook input priority filter; policy accept;
		iifname "wan" udp dport 67 drop
	}
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "wan" masquerade
	}
}
